name: Check upstream release
on:
  push:
    branches:
      - main
  schedule:
    - cron: 0 */8 * * * # 00:00, 08:00, 16:00 every day

permissions: {}

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check upstream release
        id: check-upstream-release
        run: cargo run -r --bin check_upstream_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      new-upstream-version: ${{ steps.check-upstream-release.outputs.new-upstream-version }}
      release-name: ${{ steps.check-upstream-release.outputs.release-name }}

  release:
    name: Release
    needs: check-release
    if: needs.check-release.outputs.new-upstream-version != ''

    permissions:
      contents: write

    uses: $/.github/workflows/release.yml
    with:
      upstream-tag: ${{ needs.check-release.outputs.new-upstream-version }}
      release-name: ${{ needs.check-release.outputs.release-name }}
    secrets:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      HOMEBREW_CASK_BUMPER_PRIVATE_KEY: ${{ secrets.HOMEBREW_CASK_BUMPER_PRIVATE_KEY }}

name: Check upstream release
on:
  push:
    branches:
      - main
      - shell-rewrite
  schedule:
    - cron: 46 * * * *  # At minute 46 every hour

permissions: {}

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check upstream release
        id: check-upstream-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-upstream-release.sh

    outputs:
      new-upstream-version: ${{ steps.check-upstream-release.outputs.new-upstream-version }}
      release-name: ${{ steps.check-upstream-release.outputs.release-name }}

  release:
    name: Release
    needs: check-release
    if: needs.check-release.outputs.new-upstream-version != ''

    permissions:
      contents: write

    uses: $/.github/workflows/release.yml
    with:
      upstream-tag: ${{ needs.check-release.outputs.new-upstream-version }}
      release-name: ${{ needs.check-release.outputs.release-name }}
    secrets:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      HOMEBREW_CASK_BUMPER_PRIVATE_KEY: ${{ secrets.HOMEBREW_CASK_BUMPER_PRIVATE_KEY }}

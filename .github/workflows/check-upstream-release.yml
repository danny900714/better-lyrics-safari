name: Check upstream release
on:
  push:
    branches:
      - main
  schedule:
    - cron: 46 * * * *  # At minute 46 every hour

permissions: {}

jobs:
  check-upstream-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check upstream release
        id: check-upstream-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-upstream-release.sh

    outputs:
      new-upstream-version: ${{ steps.check-upstream-release.outputs.new-upstream-version }}
      release-name: ${{ steps.check-upstream-release.outputs.release-name }}

  dispatch-release:
    name: Dispatch release workflow
    needs: check-upstream-release
    if: needs.check-upstream-release.outputs.new-upstream-version != ''
    runs-on: ubuntu-latest

    permissions:
      actions: write  # Dispatch release workflow

    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ needs.check-upstream-release.outputs.new-upstream-version }}
          RELEASE_NAME: ${{ needs.check-upstream-release.outputs.release-name }}
        run: gh workflow run release.yml -f upstream-tag="$UPSTREAM_TAG" -f release-name="$RELEASE_NAME"

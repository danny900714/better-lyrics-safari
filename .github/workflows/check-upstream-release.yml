name: Check upstream release
on:
  push:
    branches:
      - main
  schedule:
    - cron: 0 */8 * * * # 00:00, 08:00, 16:00 every day

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check upstream release
        id: check-upstream-release
        run: cargo run -r --bin check_upstream_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      new-upstream-version: ${{ steps.check-upstream-release.outputs.new-upstream-version }}
      release-name: ${{ steps.check-upstream-release.outputs.release-name }}

name: Release
run-name: Release ${{ inputs.release-name }} (based on Better Lyrics ${{ inputs.upstream-tag }})
on:
  workflow_dispatch:
    inputs: &inputs
      upstream-tag:
        description: The tag of the upstream repository to release from
        required: true
        type: string
      release-name:
        description: The name of the release
        required: true
        type: string
  workflow_call:
    inputs: *inputs
    secrets:
      SIGNING_CERTIFICATE_BASE64:
        description: Base64-encoded Apple signing certificate
        required: true
      SIGNING_CERTIFICATE_PASSWORD:
        description: Password for the signing certificate
        required: true
      KEYCHAIN_PASSWORD:
        description: Password for the keychain
        required: true
      HOMEBREW_CASK_BUMPER_PRIVATE_KEY:
        description: Private key for the Homebrew Cask Bumper GitHub App
        required: true

env:
  DMG_NAME: better-lyrics-${{ inputs.release-name }}.dmg

permissions: {}

concurrency:
  group: release-${{ inputs.release-name }}

jobs:
  build:
    name: Build
    runs-on: macos-latest

    env:
      CURRENT_REPOSITORY_PATH: better-lyrics-safari
      UPSTREAM_REPOSITORY_PATH: better-lyrics

    permissions:
      contents: read
      id-token: write     # for attestations
      attestations: write # for attestations

    defaults:
      run:
        working-directory: ${{ env.UPSTREAM_REPOSITORY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: ${{ env.CURRENT_REPOSITORY_PATH }}

      - name: Checkout upstream repository
        env:
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        uses: actions/checkout@v7.0.1
        with:
          repository: better-lyrics/better-lyrics
          ref: ${{ inputs.upstream-tag }}
          path: ${{ env.UPSTREAM_REPOSITORY_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.UPSTREAM_REPOSITORY_PATH }}/package-lock.json

      - name: Install create-dmg
        run: npm install -g create-dmg

      - name: Apply safari patch
        run: git apply --stat --apply "$GITHUB_WORKSPACE/$CURRENT_REPOSITORY_PATH/safari.patch"

      - name: Install dependencies
        run: npm ci

      - name: Install the apple signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        working-directory: ${{ env.CURRENT_REPOSITORY_PATH }}
        run: scripts/install-signing-certificate.sh

      - name: Build the extension for Safari
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          RELEASE_NAME: ${{ inputs.release-name }}
        run: npm run build:safari

      - name: Create DMG
        run: create-dmg --no-code-sign --no-version-in-filename "dist/safari-xcode/.derived/Build/Products/Release/Better Lyrics.app"

      - name: Rename DMG
        run: mv 'Better Lyrics.dmg' "$DMG_NAME"

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.UPSTREAM_REPOSITORY_PATH }}/${{ env.DMG_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.UPSTREAM_REPOSITORY_PATH }}/${{ env.DMG_NAME }}
          archive: false
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write # for creating GitHub release

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.DMG_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ inputs.release-name }}
          tag_name: v${{ inputs.release-name }}
          body: This release is based on upstream [Better Lyrics ${{ inputs.upstream-tag }}](https://github.com/better-lyrics/better-lyrics/releases/tag/${{ inputs.upstream-tag }}).
          generate_release_notes: true
          files: ${{ env.DMG_NAME }}
          fail_on_unmatched_files: true

  bump-homebrew-cask:
    name: Bump Homebrew cask
    runs-on: ubuntu-latest
    needs: github-release

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_CASK_BUMPER_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_CASK_BUMPER_PRIVATE_KEY }}
          repositories: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          permission-actions: write

      - name: Dispatch bump cask workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          CASK: ${{ vars.CASK_TOKEN }}
          VERSION: ${{ inputs.release-name }}
        run: |
          output=$(gh workflow run bump-cask.yml -f cask="$CASK" -f version="$VERSION")
          echo "Workflow run URL: $output"
          run_id=$(grep -oE 'runs/[0-9]+' <<< "$output" | head -1 | cut -d / -f 2)
          gh run watch "$run_id" --exit-status

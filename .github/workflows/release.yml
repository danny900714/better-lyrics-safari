name: Release
run-name: Release ${{ inputs.release-name }} (based on Better Lyrics ${{ inputs.upstream-tag }})
on:
  workflow_dispatch:
    inputs: &inputs
      upstream-tag:
        description: The tag of the upstream repository to release from
        required: true
        type: string
      release-name:
        description: The name of the release
        required: true
        type: string
  workflow_call:
    inputs: *inputs
    secrets:
      SIGNING_CERTIFICATE_BASE64:
        description: Base64-encoded Apple signing certificate
        required: true
      SIGNING_CERTIFICATE_PASSWORD:
        description: Password for the signing certificate
        required: true
      KEYCHAIN_PASSWORD:
        description: Password for the keychain
        required: true

jobs:
  release:
    name: Release
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      DMG_NAME: better-lyrics-${{ inputs.release-name }}.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout upstream repository
        env:
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$UPSTREAM_TAG" \
          https://github.com/better-lyrics/better-lyrics.git \
          "$RUNNER_TEMP/better-lyrics"

      - name: Check safari patch
        run: git apply --check --stat "$GITHUB_WORKSPACE/safari.patch"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Apply safari patch
        run: git apply "$GITHUB_WORKSPACE/safari.patch"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install create-dmg
        run: npm install -g create-dmg

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Install the apple signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/install-signing-certificate.sh

      - name: Build the extension for Safari
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          RELEASE_NAME: ${{ inputs.release-name }}
        run: npm run build:safari
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Create DMG
        run: create-dmg --no-code-sign --no-version-in-filename "dist/safari-xcode/.derived/Build/Products/Release/Better Lyrics.app"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Rename DMG
        run: mv 'Better Lyrics.dmg' "$DMG_NAME"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/better-lyrics/${{ env.DMG_NAME }}
          archive: false
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.release-name }}
          tag_name: v${{ inputs.release-name }}
          body: This release is based on upstream [Better Lyrics ${{ inputs.upstream-tag }}](https://github.com/better-lyrics/better-lyrics/releases/tag/${{ inputs.upstream-tag }}).
          generate_release_notes: true
          files: ${{ env.DMG_NAME }}
          working_directory: ${{ runner.temp }}/better-lyrics
          fail_on_unmatched_files: true

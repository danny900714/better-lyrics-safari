name: Release
on:
  workflow_dispatch:
    inputs: &inputs
      upstream-tag:
        description: The tag of the upstream repository to release from
        required: true
        type: string
      release-name:
        description: The name of the release
        required: true
        type: string
  workflow_call:
    inputs: *inputs
    secrets:
      SIGNING_CERTIFICATE_BASE64:
        description: Base64-encoded Apple signing certificate
        required: true
      SIGNING_CERTIFICATE_PASSWORD:
        description: Password for the signing certificate
        required: true
      KEYCHAIN_PASSWORD:
        description: Password for the keychain
        required: true

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout upstream repository
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch ${{ inputs.upstream-tag }} \
          https://github.com/better-lyrics/better-lyrics.git \
          "$RUNNER_TEMP/better-lyrics"

      - name: Check safari patch
        run: git apply --check --stat "$GITHUB_WORKSPACE/safari.patch"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Apply safari patch
        run: git apply "$GITHUB_WORKSPACE/safari.patch"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/better-lyrics/package-lock.json

      - name: Install create-dmg
        run: npm install -g create-dmg

      - name: Install the apple signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          SIGNING_CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          
          # Import certificate and provisioning profile from secrets
          echo -n "$SIGNING_CERTIFICATE_BASE64" | base64 --decode -o "$SIGNING_CERTIFICATE_PATH"
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import signing certificate to keychain
          security import "$SIGNING_CERTIFICATE_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Build the extension for Safari
        run: npm build:safari
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Create DMG
        run: create-dmg --no-version-in-filename "dist/safari-xcode/.derived/Build/Products/Release/Better Lyrics.app"
        working-directory: ${{ runner.temp }}/better-lyrics

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/better-lyrics/Better Lyrics.dmg
          archive: false
          if-no-files-found: error
